<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Dewey Dash">
  <title>Dewey Dash</title>
  <defs>
    <clipPath id="tile">
      <rect width="32" height="32" rx="7"/>
    </clipPath>
  </defs>

  <!-- navy tile, matching the game's titlebar -->
  <rect width="32" height="32" rx="7" fill="#31566c"/>

  <!-- speed lines, clipped so they can't spill past the rounded corners -->
  <g clip-path="url(#tile)">
    <g transform="translate(0 3) rotate(-14 6 16)">
      <path fill="#e9b750" opacity=".6" d="M10.8 8.9v3.2L2 10.9a.6.6 0 0 1 0-1.1l8.8-.9Z"/>
      <path fill="#ffd267" d="M11.6 14.7v3.6L1 16.9a.6.6 0 0 1 0-1.2l10.6-1Z"/>
      <path fill="#e9b750" opacity=".6" d="M10.8 20.7v3.2L2.6 22.8a.6.6 0 0 1 0-1.1l8.2-1Z"/>
    </g>
  </g>

  <!-- the book -->
  <g transform="rotate(-14 20 16)">
    <rect x="12" y="6.5" width="16" height="19" rx="2.4" fill="#fbf4e7"/>
    <rect x="12" y="6.5" width="4.6" height="19" rx="2.4" fill="#d1614b"/>
    <rect x="18.4" y="11" width="7.6" height="2.1" rx="1" fill="#31566c" opacity=".55"/>
    <rect x="18.4" y="15.4" width="7.6" height="2.1" rx="1" fill="#31566c" opacity=".55"/>
  </g>
</svg>
